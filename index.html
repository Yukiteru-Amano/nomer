<script>

const hexA=(c,a)=>{const n=parseInt(c.slice(1),16);return`rgba(${n>>16},${n>>8&255},${n&255},${a})`};
function hud(){$('bal').textContent=fmt(G.bal)+' ₽';$('usd').textContent=G.usd+' $';$('lk').hidden=!G.luck;$('lk').textContent='🍀 '+G.luck}
function toast(ic,t,s,btn){const d=document.createElement('div');d.className='toast';d.innerHTML=`<span class="ic">${ic}</span><div><b>${t}</b><small>${s}</small></div>`+(btn?'<button>Открыть →</button>':'');if(btn)d.querySelector('button').onclick=()=>{openStats();d.remove()};$('ts').prepend(d);setTimeout(()=>d.remove(),3600);while($('ts').children.length>2)$('ts').lastChild.remove()}
function plateHTML(p){const D=p.D.join(''),L=p.L,t=p.type,m=t===0?L[0]+D+L[1]+L[2]:t===1?L.join('')+' '+D:L[0]+' '+D;
return`<div class="plate t${t} pop"><div class="pm">${m}</div><div class="pr"><b class="${p.reg.length>2?'s':''}">${p.reg}</b><i>RUS <span class="flag"></span></i></div></div>`}
function setR(r){const c=RAR[r];$('rn').textContent=c.n;$('rn').style.color=c.c;$('pv').style.color=r?c.c:'#e6e6ee';$('app').style.setProperty('--g',hexA(c.c,r?.3:.14));
$('dash').innerHTML=RAR.map((_,i)=>`<i style="${i<=r?'background:'+c.c:''}"></i>`).join('')}
function roll(){au();let b=null;for(let i=0,n=G.luck>0?3:1;i<n;i++){const p=gen(),a=analyze(p),v=a.fl?Math.max(price(a.m),Math.round(RAR[a.fl].t*(1+Math.random()*.8))):price(a.m);if(!b||v>b.v)b={p,a,v}}
if(G.luck>0)G.luck--;const ri=ridx(b.v),isRec=b.v>G.best&&G.rolls>0;
for(const X of[G,S]){X.rolls++;X.rar[ri]++;X.typ[b.p.type]++;X.xp+=10*(ri+1)**2;if(b.v>X.best)X.best=b.v;for(const k of b.a.f){const q=k==='lt3'?'lt':k==='dg3'?'dg':k;X.pat[q]=(X.pat[q]||0)+1}}
const fresh=b.a.f.filter(k=>!G.dex[k]);for(const k of b.a.f){const d=G.dex[k]||(G.dex[k]={n:0,v:0,s:''});d.n++;if(b.v>=d.v){d.v=b.v;d.s=pstr(b.p)}}
const l0=lvlOf(G.xp-10*(ri+1)**2)[0],l1=lvlOf(G.xp)[0];G.bal+=b.v;const first=!G.unl[ri];G.unl[ri]=1;hud();save();
$('hint').hidden=true;$('mid').hidden=false;show(b,ri);
const dur=300+ri*450+(ri>=3?500:0);
setTimeout(()=>{for(const k of fresh)toast('📖','Новая запись в индексе',SEC[k]?'★ Секрет: '+SEC[k]:(DEX.find(d=>d[0]===k)||[0,k])[1]);if(first&&ri)toast('🔓','Открыто новое',RAR[ri].n);if(isRec)toast('🏆','Новый рекорд','Номер за '+fmt(b.v)+' ₽',1);if(l1>l0){G.usd++;hud();save();toast('⭐','Уровень '+l1,'+1 $')}},dur);tone(380+ri*90,.05,'square',.05)}
function show(b,ri){if(anim)cancelAnimationFrame(anim);$('pl').innerHTML=plateHTML(b.p);$('pl').style.filter='';$('ds').style.opacity=0;const isSec=b.a.f.some(k=>SEC[k]);let lt=0;
const dur=300+ri*450+(ri>=3?500:0),t0=performance.now();let cr=-1;
const lines=(b.a.f.includes('ace')?'Блатная серия под названием «три туза».<br>':'')+b.a.f.filter(k=>k!=='ace').map(k=>k==='dg3'?b.p.D.length+' одинаковые цифры':SEC[k]?'<b style="color:#facc15">★ Секрет: '+SEC[k]+'</b>':LN[k]).join('<br>');
const step=t=>{if(ri>=2&&t-lt>70){lt=t;tone(180+((t-t0)/dur)*900,.05,'square',.05)}const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3),cv=Math.round(b.v*e),r=ridx(cv);if(r!==cr){cr=r;setR(r)}$('pv').textContent=fmt(cv)+' ₽';
if(k<1)anim=requestAnimationFrame(step);else{anim=null;$('ds').innerHTML=lines;$('ds').style.opacity=1;if(ri>=2||isSec)epic(b,ri,isSec);else chime(ri)}};anim=requestAnimationFrame(step)}
/* particles */
const fx=$('fx'),fc=fx.getContext('2d');let P=[];
function sz(){fx.width=$('app').clientWidth;fx.height=$('app').clientHeight}addEventListener('resize',sz);sz();
function burst(c,n){const x=fx.width/2,y=fx.height*.46;for(let i=0;i<n;i++){const a=Math.random()*6.283,s=2+Math.random()*7;P.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,l:1,c})}}
(function lp(){requestAnimationFrame(lp);if(!P.length)return;fc.clearRect(0,0,fx.width,fx.height);fc.globalCompositeOperation='lighter';
for(let i=P.length-1;i>=0;i--){const p=P[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.18;p.vx*=.99;p.l-=.016;if(p.l<=0){P.splice(i,1);continue}fc.fillStyle=hexA(p.c,p.l*.9);fc.fillRect(p.x-2,p.y-2,4,4);fc.fillStyle=hexA(p.c,p.l*.2);fc.fillRect(p.x-6,p.y-6,12,12)}})();
/* stats */
function renderStats(){const X=tab?S:G,[lv,rem]=lvlOf(G.xp),mx=Math.max(1,...X.rar);
let h=`<div class="hd"><button id="sb" aria-label="Назад">←</button><h2>Статистика</h2></div><div class="tabs"><button class="${tab?'':'on'}" data-t="0">Общая</button><button class="${tab?'on':''}" data-t="1">За сессию</button></div>`;
if(!tab)h+=`<div style="font-size:13px">Уровень ${lv}</div><div class="bar"><i style="width:${rem/need(lv)*100}%;background:#3b82f6"></i></div>`;
h+=`<div class="cards"><div class="cd"><b>${fmt(X.rolls)}</b><small>Всего номеров</small></div><div class="cd"><b>${fmt(X.best)} ₽</b><small>Самый дорогой номер</small></div></div>`;
RAR.forEach((r,i)=>h+=`<div class="rr"><span style="color:${r.c}">${r.n}</span><div class="bar"><i style="width:${X.rar[i]/mx*100}%;background:${r.c}"></i></div><span>${fmt(X.rar[i])}</span></div>`);
h+='<div style="height:10px"></div>';for(const k in PN)h+=`<div class="row"><span>${PN[k]}</span><span>${X.pat[k]||0}</span></div>`;
TN.forEach((n,i)=>h+=`<div class="row"><span>${n}</span><span>${X.typ[i]}</span></div>`);$('st').innerHTML=h;
$('sb').onclick=()=>{$('st').hidden=true};$('st').querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=+b.dataset.t;renderStats()})}
function openStats(){$('mn').hidden=true;fsAd(()=>{renderStats();$('st').hidden=false})}
/* menu + input */
$('mb').onclick=()=>{$('m4').textContent='🔊 Звук: '+(G.mute?'выкл':'вкл');$('mn').hidden=false};
$('mn').onclick=e=>{if(e.target===$('mn'))$('mn').hidden=true};
$('chip').onclick=openStats;$('m1').onclick=openStats;
$('m2').onclick=()=>{if(G.usd<3){toast('💵','Не хватает $','Получай их за уровни и рекламу');return}G.usd-=3;G.luck=30;hud();save();$('mn').hidden=true;toast('🍀','Удача включена','Следующие 30 номеров лучше')};
$('m3').onclick=()=>{$('mn').hidden=true;rewardAd()};
$('m4').onclick=()=>{G.mute=!G.mute;save();$('m4').textContent='🔊 Звук: '+(G.mute?'выкл':'вкл')};
$('m5').onclick=()=>{if(confirm(lang==='en'?'Reset all progress?':'Сбросить весь прогресс?')){G=Object.assign(emp(),{bal:0,usd:0,luck:0,unl:[1,0,0,0,0],mute:G.mute,dex:{}});S=emp();save();hud();$('mid').hidden=true;$('hint').hidden=false;$('mn').hidden=true}};
$('app').addEventListener('pointerdown',e=>{if(e.target.closest('button,.ov,.toast'))return;roll()});
addEventListener('keydown',e=>{if((e.code==='Space'||e.code==='Enter')&&$('st').hidden&&$('mn').hidden){e.preventDefault();if(!e.repeat)roll()}});
const SEC={s777:'Три семёрки',s666:'Число зверя',s000:'Нулевой номер',sKOT:'Слово «КОТ»',s112:'Экстренная служба',sMEGA:'Тот самый номер'};
const HINT={s777:'Счастливая тройка',s666:'Число зверя… или просто цифры',s000:'Ничего. Совсем ничего',sKOT:'Усатый и полосатый',s112:'Позвони, если повезло',sMEGA:'Столица и три удачи'};
const DEX=[['sm','Малый номер: 001–009',60],['ace','Серия «три туза»',40],['lt3','Три одинаковые буквы',30],['dg3','Все цифры одинаковые',25],['reg','Цифры совпадают с регионом',18],['rnd','Круглый номер: 100–900',15],['seq','Цифры подряд',12],['pal','Палиндром букв',5],['lt','Две одинаковые буквы',4],['mir','Зеркальные цифры',4],['dg','Две одинаковые цифры',2]];
const pstr=p=>{const D=p.D.join(''),L=p.L,t=p.type;return(t===0?L[0]+D+L[1]+L[2]:t===1?L.join('')+' '+D:L[0]+' '+D)+' '+p.reg};
const fan=r=>{tone(98,.9,'sawtooth',.09);[0,4,7,12,16,19,24,28].slice(0,3+r).forEach((x,i)=>tone(330*2**(x/12),.5,'triangle',.13,i*.09));if(r>=4)tone(1318,1.2,'sine',.1,.7)};
function epic(b,ri,sec){const c=sec&&ri<3?'#facc15':RAR[ri].c,f=$('flash'),a=$('app'),bn=$('bn');
f.style.background=c;f.className='';void f.offsetWidth;f.className='fl';
if(ri>=3){a.classList.remove('shake');void a.offsetWidth;a.classList.add('shake');$('ry').style.setProperty('--rc',hexA(c,.28));$('ry').style.opacity=1;setTimeout(()=>{$('ry').style.opacity=0},4200)}
$('bt').style.color=c;$('bt').textContent=sec?'★ СЕКРЕТНЫЙ НОМЕР ★':['','','РЕДКИЙ НОМЕР','ЭПИЧЕСКИЙ НОМЕР!','ЛЕГЕНДАРНЫЙ НОМЕР!!!'][ri];$('bs').style.color=c;$('bs').textContent='+'+fmt(b.v)+' ₽';
bn.className='';void bn.offsetWidth;bn.className='on';
burst(c,ri>=4?260:ri>=3?150:80);if(ri>=3){setTimeout(()=>burst(c,120),250);setTimeout(()=>burst('#ffffff',90),500)}
$('pl').style.filter='drop-shadow(0 0 '+(10+ri*7)+'px '+c+')';fan(ri);try{navigator.vibrate&&navigator.vibrate(ri>=4?[80,40,80,40,200]:ri>=3?[60,30,120]:40)}catch(e){}}
let ixt=0;
function renderIx(){const dx=G.dex,sk=Object.keys(SEC);let h=`<div class="hd"><button id="ib" aria-label="Назад">←</button><h2>Индекс номеров</h2></div><div class="tabs"><button class="${ixt?'':'on'}" data-i="0">Редкие ${DEX.filter(d=>dx[d[0]]).length}/${DEX.length}</button><button class="${ixt?'on':''}" data-i="1">Секретки ${sk.filter(k=>dx[k]).length}/${sk.length}</button></div>`;
if(!ixt)DEX.forEach(([k,n,m])=>{const d=dx[k],c=m>=40?'#facc15':m>=15?'#a855f7':m>=5?'#60a5fa':'#4ade80';h+=`<div class="dx${d?'':' lk'}"><div class="row" style="border:0;padding:0"><span style="color:${d?'#fff':'#9a9aae'}">${d?'✔':'○'} ${n}</span><b style="color:${c}">×${m}</b></div>${d?`<small>${d.s} · ${fmt(d.v)} ₽ · выпадало: ${d.n}</small>`:''}</div>`});
else sk.forEach(k=>{const d=dx[k];h+=`<div class="dx${d?'':' lk'}"><div style="color:${d?'#facc15':'#9a9aae'}">${d?'★ '+SEC[k]:'🔒 ???'}</div><small>${d?d.s+' · '+fmt(d.v)+' ₽ · выпадало: '+d.n:'Подсказка: '+HINT[k]}</small></div>`});
$('ix').innerHTML=h;$('ib').onclick=()=>{$('ix').hidden=true};$('ix').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{ixt=+b.dataset.i;renderIx()})}
$('m6').onclick=()=>{$('mn').hidden=true;ixt=0;renderIx();$('ix').hidden=false};
setR(0);hud();
</script>
